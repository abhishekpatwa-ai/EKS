# Sample app: Deployment (2 pods) -> Service -> Ingress (the controller creates an ALB)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
spec:
  replicas: 2
  selector:
    matchLabels: { app: hello }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } # zero-downtime rollout
  template:
    metadata:
      labels: { app: hello }
    spec:
      containers:
        - name: web
          image: public.ecr.aws/nginx/nginx:stable-alpine
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 100m, memory: 64Mi } # scheduler uses these
            limits: { memory: 128Mi }
          readinessProbe: # traffic only after this passes
            httpGet: { path: /, port: 80 }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: hello
spec:
  type: ClusterIP
  selector: { app: hello } # matches the pod labels
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip # ALB sends straight to pod IPs (VPC CNI)
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello
                port: { number: 80 }
